# Keeps pnpm-lock.yaml fresh across the monorepo. Updates are batched into
# one weekly PR per ecosystem to keep review noise manageable.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
